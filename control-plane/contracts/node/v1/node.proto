syntax = "proto3";

package bproxy.node.v1;

option go_package = "bproxy-node-contracts/node/v1;nodev1";

import "google/protobuf/timestamp.proto";

// The hub never pushes configuration payloads. It only tells the node which
// revision it should be running; the node decides when to fetch and retries on
// its own. That keeps the hub side of a session completely stateless: there is
// no per-session bookkeeping to lose, and therefore no lease or fencing token.
service NodeControlService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Renew(RenewRequest) returns (EnrollResponse);

  // Wake-up signal only. Carries a revision number, never a payload.
  rpc Watch(WatchRequest) returns (stream ConfigNotice);

  // Idempotent: the node calls it whenever its applied revision differs from
  // the announced one, and also every 30s as a reconcile.
  rpc FetchConfig(FetchConfigRequest) returns (ConfigDocument);

  // Everything the node reports. Unary and idempotent by batch_id.
  rpc Report(ReportRequest) returns (ReportResponse);
}

message EnrollRequest {
  string node_id = 1;
  string token = 2;
  bytes csr_pem = 3;
  string agent_version = 4;
}

message EnrollResponse {
  bytes certificate_pem = 1;
  bytes ca_certificate_pem = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RenewRequest {
  bytes csr_pem = 1;
  string agent_version = 2;
}

message WatchRequest {
  string node_id = 1;
  string agent_version = 2;
}

message ConfigNotice {
  uint64 revision = 1;
  string config_sha256 = 2;
}

message FetchConfigRequest {
  string node_id = 1;
}

message ConfigDocument {
  uint64 revision = 1;
  string config_sha256 = 2;
  bytes config_toml = 3;
}

message ReportRequest {
  string node_id = 1;
  // Changes on every core restart. A flapping boot_id means two agents are
  // claiming the same node.
  string boot_id = 2;
  // Monotonic within boot_id.
  uint64 seq = 3;
  // Idempotency key: a repeated batch_id must not double-count traffic.
  string batch_id = 4;

  Health health = 5;
  // Full replacement, not a delta. The node knows its own runtime state better
  // than the hub could reconstruct it from an event log.
  RuntimeSnapshot runtime = 6;
  repeated InterfaceTrafficDelta interface_traffic = 7;
  repeated UserTrafficDelta user_traffic = 8;
  // Activity log for the panel. Projects nothing, so a gap here is harmless.
  repeated RuntimeEvent events = 9;
}

message Health {
  uint64 applied_revision = 1;
  string applied_sha256 = 2;
  // Empty means the configuration applied cleanly.
  string apply_error = 3;
  string core_version = 4;
  string agent_version = 5;
  int64 uptime_seconds = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message ReportResponse {
  // Delivered exactly once. The hub tracks delivery because the node does not
  // survive its own restart and would otherwise receive the same command again.
  repeated AgentCommand commands = 1;
}

message AgentCommand {
  uint64 nonce = 1;
  string kind = 2;
}

message InterfaceTrafficDelta {
  string interface = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_packets = 4;
  uint64 tx_packets = 5;
  uint64 rx_errors = 6;
  uint64 tx_errors = 7;
  uint64 rx_dropped = 8;
  uint64 tx_dropped = 9;
  google.protobuf.Timestamp observed_at = 10;
}

// Decrypted BoardProxy payload attributed by core. It is never summed with
// InterfaceTrafficDelta.
message UserTrafficDelta {
  string user_id = 1;
  uint64 rx_bytes = 2; // client upload
  uint64 tx_bytes = 3; // client download
  google.protobuf.Timestamp observed_at = 4;
}

message RuntimeSnapshot {
  string core_boot_id = 1;
  google.protobuf.Timestamp captured_at = 2;
  repeated RuntimeUserSnapshot users = 3;
  repeated RuntimeBoardSnapshot boards = 4;
}

message RuntimeUserSnapshot {
  string user_id = 1;
  uint32 active_sessions = 2;
  uint32 active_lanes = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

message RuntimeBoardSnapshot {
  string board_id = 1;
  string state = 2;
  uint32 active_lanes = 3;
  string last_error = 4;
}

message RuntimeEvent {
  string type = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // Free-form JSON payload rendered by the panel.
  string payload_json = 3;
}
