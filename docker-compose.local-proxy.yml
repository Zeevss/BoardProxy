# Нода в сетевом стеке хоста.
#
# Нужно там, где интернет у машины идёт через локальный прокси, слушающий
# loopback: из сети compose до 127.0.0.1 хоста не дотянуться, и ядро не
# открывает доску — `join board: request-guest-token` висит в бесконечных
# ретраях. В обычном развёртывании нода стоит на сервере с прямым выходом,
# и этот файл не нужен.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.local-proxy.yml \
#     --profile node up -d --build node
#
# Одна поправка, без которой счётчики останутся пустыми:
# BPROXY_STATS_INTERFACES=eth0 считает интерфейс контейнера, которого в сети
# хоста нет. Укажите интерфейс хоста — `ip -o -4 addr show scope global`.
services:
  node:
    network_mode: host
    # Имени `hub` в сети хоста нет, а в enrollment-секрете оно уже зашито.
    # Запись в /etc/hosts сохраняет секрет рабочим и оставляет TLS сходящимся:
    # `hub` входит в CONTROL_GRPC_SERVER_NAMES, в отличие от 127.0.0.1.
    extra_hosts:
      - "hub:127.0.0.1"
    environment:
      # Пусто — ходим напрямую: в сети хоста это обычно и так работает.
      # Заполняйте, когда прямой выход закрыт, а прокси есть.
      HTTP_PROXY: ${BPROXY_NODE_HTTP_PROXY:-}
      HTTPS_PROXY: ${BPROXY_NODE_HTTP_PROXY:-}
      # Хаб и ядро рядом — гонять их через прокси незачем. gRPC-клиент
      # уважает эти переменные, и без исключения регистрация ушла бы в прокси.
      NO_PROXY: ${BPROXY_NODE_NO_PROXY:-localhost,127.0.0.1,::1}
