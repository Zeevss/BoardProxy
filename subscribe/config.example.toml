# Всё, что сервис подписок знает о себе сам. Публичный URL, ссылка на Яндекс
# Таблицу, recovery-ключ и ссылки на клиенты задаются в панели control-plane
# и приезжают сюда автоматически — здесь их указывать не нужно.

[server]
listen = ":8090"

[control_plane]
url = "http://hub:8080"
# Токен выпускается в панели: Настройки → Система подписок.
token = "bpat_replace-me"
timeout = "10s"
