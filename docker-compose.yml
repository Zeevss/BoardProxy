# Stateless BoardProxy core. Copy core/config.example.toml to config.toml,
# generate the keys and fill in the board hash before starting.

services:
  core:
    build: ./core
    restart: unless-stopped
    command: ["serve", "--config", "/etc/bproxy/config.toml"]
    environment:
      # Raw RX/TX Linux bridge, read-only counters below.
      BPROXY_NETWORK_STATS_DIR: /host-net-stats
      BPROXY_NETWORK_INTERFACE: bproxy0
    volumes:
      - ${BPROXY_CONFIG:-./config.toml}:/etc/bproxy/config.toml:ro
      - bproxy-run:/run/bproxy
      - /sys/class/net/bproxy0/statistics:/host-net-stats:ro
    networks:
      - internal

volumes:
  bproxy-run:

networks:
  internal:
    driver: bridge
    # Stable name lets core read only the bridge counters, not Docker socket.
    driver_opts:
      com.docker.network.bridge.name: bproxy0
