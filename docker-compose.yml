# BoardProxy: сервер (core) + админ-панель (panel).
#
# Наружу публикуется ТОЛЬКО порт панели. core живёт во внутренней сети и
# доступен лишь панели/Caddy — его web-api не имеет опубликованных портов.
# Настройки — в .env (см. .env.example).

services:
  core:
    build: ./core
    restart: unless-stopped
    # Пароль и доски передаём ТОЛЬКО через environment (флаги читают их из env
    # через getenvOr), чтобы секрет не светился в `ps`/`docker inspect` командой.
    command:
      - serve
      - --web-api=0.0.0.0:8080
      - --db=/data/bproxy.db
      - --key-file=/data/bproxy.key
      # Живой клиент присылает heartbeat каждые 30с; 90с — три пропуска.
      - --idle-timeout=${BPROXY_IDLE_TIMEOUT:-90s}
      - --stream-idle-timeout=${BPROXY_STREAM_IDLE_TIMEOUT:-0s}
    environment:
      BPROXY_WEB_UI_PASSWORD: ${BPROXY_WEB_UI_PASSWORD}
      # BPROXY_BOARD — одна доска или несколько через запятую (hashA,hashB).
      BPROXY_BOARD: ${BPROXY_BOARD}
      BPROXY_SERVER_MAX_SESSIONS_PER_USER: ${BPROXY_SERVER_MAX_SESSIONS_PER_USER:-4}
      BPROXY_ALLOW_PRIVATE_EGRESS: ${BPROXY_ALLOW_PRIVATE_EGRESS:-false}
      # Raw RX/TX всего Linux bridge (core + panel), read-only counters below.
      BPROXY_NETWORK_STATS_DIR: /host-net-stats
      BPROXY_NETWORK_INTERFACE: bproxy0
    volumes:
      - bproxy-data:/data
      - /sys/class/net/bproxy0/statistics:/host-net-stats:ro
    networks:
      - internal

  panel:
    build: ./panel
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "${PANEL_PORT:-8080}:80"
    networks:
      - internal

volumes:
  bproxy-data:

networks:
  internal:
    driver: bridge
    # Стабильное имя позволяет безопасно смонтировать только два read-only
    # счётчика bridge, без Docker socket и доступа ко всему host /sys.
    driver_opts:
      com.docker.network.bridge.name: bproxy0
