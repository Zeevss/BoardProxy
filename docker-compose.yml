services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardproxy
      POSTGRES_USER: boardproxy
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-boardproxy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardproxy -d boardproxy"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - control-db:/var/lib/postgresql

  hub:
    build:
      context: .
      dockerfile: control-plane/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONTROL_DB_URL: jdbc:postgresql://postgres:5432/boardproxy
      CONTROL_DB_USER: boardproxy
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-boardproxy}
      CONTROL_MASTER_KEY: ${CONTROL_MASTER_KEY:?CONTROL_MASTER_KEY must be set to a base64-encoded 32-byte key}
      CONTROL_MASTER_KEY_ID: ${CONTROL_MASTER_KEY_ID:-control-master-v1}
      CONTROL_MASTER_KEYS: ${CONTROL_MASTER_KEYS:-}
      CONTROL_BOOTSTRAP_ADMIN_TOKEN: ${CONTROL_BOOTSTRAP_ADMIN_TOKEN:-}
      CONTROL_PANEL_SESSION_TTL: ${CONTROL_PANEL_SESSION_TTL:-PT12H}
      CONTROL_GRPC_SERVER_NAMES: ${CONTROL_GRPC_SERVER_NAMES:-hub,localhost}
      CONTROL_ALLOWED_ORIGINS: ${CONTROL_ALLOWED_ORIGINS:-}
      CONTROL_REQUESTS_PER_MINUTE: ${CONTROL_REQUESTS_PER_MINUTE:-300}
      CONTROL_MAXIMUM_BODY_BYTES: ${CONTROL_MAXIMUM_BODY_BYTES:-2097152}
      CONTROL_RAW_RETENTION_DAYS: ${CONTROL_RAW_RETENTION_DAYS:-31}
      CONTROL_ROLLUP_RETENTION_DAYS: ${CONTROL_ROLLUP_RETENTION_DAYS:-730}
      CONTROL_SUBSCRIPTION_ENABLED: ${CONTROL_SUBSCRIPTION_ENABLED:-false}
      CONTROL_SUBSCRIPTION_PUBLIC_URL: ${CONTROL_SUBSCRIPTION_PUBLIC_URL:-}
      CONTROL_SUBSCRIPTION_YANDEX_EDITOR_URL: ${CONTROL_SUBSCRIPTION_YANDEX_EDITOR_URL:-}
      CONTROL_SUBSCRIPTION_RECOVERY_KEY_ID: ${CONTROL_SUBSCRIPTION_RECOVERY_KEY_ID:-}
      CONTROL_SUBSCRIPTION_RECOVERY_SERVER_PUBLIC_KEY: ${CONTROL_SUBSCRIPTION_RECOVERY_SERVER_PUBLIC_KEY:-}
    ports:
      - "${BPROXY_HUB_PORT:-8443}:8443"
      - "${BPROXY_CONTROL_HTTP_PORT:-8080}:8080"
    volumes:
      - control-pki:/var/lib/boardproxy-control/pki
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  node:
    profiles: ["node"]
    build:
      context: .
      dockerfile: node-agent/Dockerfile
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      BPROXY_NODE_SECRET: ${BPROXY_NODE_SECRET:-}
      BPROXY_STATS_INTERFACES: ${BPROXY_STATS_INTERFACES:-eth0}
      BPROXY_CORE_CONTROL: unix:///run/bproxy/control.sock
      BPROXY_MAX_OUTBOX_BYTES: ${BPROXY_MAX_OUTBOX_BYTES:-268435456}
    volumes:
      - node-data:/var/lib/bproxy-node

  subscribe:
    profiles: ["subscribe"]
    build:
      context: ./subscribe
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      SUBSCRIBE_LISTEN: ":8090"
      SUBSCRIBE_PUBLIC_URL: ${CONTROL_SUBSCRIPTION_PUBLIC_URL:-}
      SUBSCRIBE_CONTROL_PLANE_URL: http://hub:8080
      SUBSCRIBE_CONTROL_PLANE_TOKEN: ${BPROXY_SUBSCRIBE_CONTROL_TOKEN:-}
      SUBSCRIBE_CONTROL_PLANE_TIMEOUT: ${BPROXY_SUBSCRIBE_CONTROL_TIMEOUT:-10s}
      SUBSCRIBE_YANDEX_EDITOR_URL: ${CONTROL_SUBSCRIPTION_YANDEX_EDITOR_URL:-}
      SUBSCRIBE_RECOVERY_KEY_ID: ${CONTROL_SUBSCRIPTION_RECOVERY_KEY_ID:-}
      SUBSCRIBE_RECOVERY_PRIVATE_KEY: ${BPROXY_SUBSCRIBE_RECOVERY_PRIVATE_KEY:-}
      SUBSCRIBE_APPS_JSON: ${BPROXY_SUBSCRIBE_APPS_JSON:-[]}
    ports:
      - "${BPROXY_SUBSCRIBE_BIND:-127.0.0.1}:${BPROXY_SUBSCRIBE_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  control-db:
  control-pki:
  node-data:
