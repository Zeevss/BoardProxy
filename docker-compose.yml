services:
  hub:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    command: ["serve", "--listen", ":8443", "--server-names", "hub,localhost"]
    ports:
      - "${BPROXY_HUB_PORT:-8443}:8443"
    volumes:
      - hub-data:/var/lib/bproxy-hub

  node:
    build:
      context: .
      dockerfile: node-agent/Dockerfile
    restart: unless-stopped
    depends_on:
      - hub
    environment:
      BPROXY_NODE_SECRET: ${BPROXY_NODE_SECRET:-}
      BPROXY_STATS_INTERFACES: ${BPROXY_STATS_INTERFACES:-eth0}
      BPROXY_CORE_CONTROL: unix:///run/bproxy/control.sock
    volumes:
      - node-data:/var/lib/bproxy-node

volumes:
  hub-data:
  node-data:
